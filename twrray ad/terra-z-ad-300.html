<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<title>Terra-Z Ad 300×450</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  body {
    margin:0;
    background:#1a1a1a;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .ad {
    width:300px;
    height:450px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-family:'Montserrat',sans-serif;
    box-shadow:0 24px 80px rgba(0,0,0,.9),0 0 0 1px #333;
  }
  /* BG image */
  .bg {
    position:absolute;
    inset:0;
    background-image: url('Terrassenüberdachung_home .png');
    background-size:cover;
    background-position:center;
    z-index:0;
  }
 

  /* TOP BAR */
  .top-bar {
    height:5px;
    background:linear-gradient(90deg,#c45e0a,#e87722,#f4a240,#e87722);
    flex-shrink:0;
    position:relative;z-index:5;
  }

  /* HEADER: logo LEFT, keywords RIGHT */
  .header {
    padding:12px 14px 10px;
    flex-shrink:0;
    position:relative;z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid rgba(232,119,34,0.3);
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(4px);
  }
  .logo-area img {
    height:30px;
    width:auto;
    object-fit:start;
    flex:0;
  }
  .kws {
    display:flex;
    flex-direction:column;
    gap:3px;
    align-items:flex-start;
  }
  .kw {
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
    background:rgba(232,119,34,0.85);
    padding:3px 7px;
    line-height:1.2;
    white-space:nowrap;
  }

  /* URL ROW */
  .url-row {
    background:rgba(0,0,0,0.5);
    padding:4px 14px;
    flex-shrink:0;
    position:relative;z-index:5;
    display:flex;
    align-items:center;
    gap:6px;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .url-dot {
    width:5px;height:5px;
   
    border-radius:50%;flex-shrink:0;
  }
  .url-text {
    font-size:25px;font-weight:800;
    letter-spacing:2px;
    color:#E86100;
  }

  /* SPACER */
  .spacer { flex:1; position:relative;z-index:5; }

  /* USPs */
  .usps {
    padding:6px 12px 6px;
    display:flex;
    flex-direction:column;
    gap:3px;
    position:relative;z-index:5;
  }
  .usp {
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 9px;
    background:rgba(0,0,0,0.62);
    border-left:3px solid #e87722;
    backdrop-filter:blur(3px);
    opacity:0;
    animation:popIn .4s cubic-bezier(.16,1,.3,1) forwards;
  }
  .usp:nth-child(1){animation-delay:.08s}
  .usp:nth-child(2){animation-delay:.15s}
  .usp:nth-child(3){animation-delay:.22s}
  .usp:nth-child(4){animation-delay:.29s}
  .usp:nth-child(5){animation-delay:.36s}
  .usp:nth-child(6){animation-delay:.43s}
  @keyframes popIn {
    from{opacity:0;transform:translateX(-10px)}
    to{opacity:1;transform:none}
  }
  .usp-icon{font-size:12px;width:16px;text-align:center;flex-shrink:0;}
  .usp-label{
    font-family:'Open Sans',sans-serif;
    font-size:14px;font-weight:400;
    color:#FFA400;line-height:1;
  }
  .usp-label b{
    font-family:'Montserrat',sans-serif;
    font-weight:800;color:#FFA400;font-size:14px;
  }

  /* CTA */
  .cta {
    padding:6px 12px 10px;
    flex-shrink:0;
    position:relative;z-index:5;
  }
  .btn-main {
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;
    background:#e87722;
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:11px;font-weight:900;
    letter-spacing:1.8px;text-transform:uppercase;
    padding:10px 0;
    border:none;cursor:pointer;text-decoration:none;
    margin-bottom:6px;
    position:relative;overflow:hidden;
  }
  .btn-main::after {
    content:'';position:absolute;top:0;left:-100%;
    width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
    animation:shine 2.8s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-100%}55%{left:130%}100%{left:130%}}
  .btn-main svg{width:13px;height:13px;fill:#fff;flex-shrink:0;}
  .contact-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .btn-c {
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:rgba(0,0,0,0.6);
    border:1px solid #333;
    color:#999;
    font-family:'Montserrat',sans-serif;
    font-size:7.5px;font-weight:700;
    letter-spacing:.5px;text-transform:uppercase;
    padding:7px 4px;cursor:pointer;text-decoration:none;
    backdrop-filter:blur(3px);
    transition:border-color .2s,color .2s;
  }
  .btn-c:hover{border-color:#e87722;color:#e87722;}
  .btn-c svg{width:10px;height:10px;fill:currentColor;flex-shrink:0;}

  .bottom-bar {
    height:4px;
    background:linear-gradient(90deg,#c45e0a,#e87722,#f4a240,#e87722);
    flex-shrink:0;position:relative;z-index:5;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="bg"></div>
  <div class="top-bar"></div>

  <div class="header">
    <div class="logo-area"><img src="logo.webp"></div>
    <div class="kws">
      <div class="kw">Terrassenüberdachung</div>
      <div class="kw">Carport</div>
      <div class="kw">Wintergarten</div>
    </div>
  </div>

  <div class="url-row">
    <div class="url-dot"></div>
    <span class="url-text">terra-z.de</span>
  </div>

  <div class="usps">
    <div><span class="usp-icon">🏆</span><span class="usp-label"><b>15 Jahre Erfahrung</b></span></div>
    <div ><span class="usp-icon">⭐</span><span class="usp-label"><b>100% Kundenzufriedenheit</b></span></div>
    <div ><span class="usp-icon">✅</span><span class="usp-label"><b>Geprüfte Qualität</b></span></div>
    <div ><span class="usp-icon">💎</span><span class="usp-label"><b>Premium Material</b></span></div>
    <div ><span class="usp-icon">🔧</span><span class="usp-label"><b>Fachgerechte</b> Montage</b></span></div>
    <div ><span class="usp-icon">📍</span><span class="usp-label">Ganz <b>NRW</b> · Faire Preise</b></span></div>
  </div>

  <div class="cta">
    <a href="https://terra-z.github.io/terraz/anfrage.html" class="btn-main">
      <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      Kostenlose Beratung
    </a>
    <div class="cta">
      <a href="https://terra-z.github.io/terraz/anfrage.html" class="btn-main">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24 11.47 11.47 0 003.58.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>
        +491638641737
      </a>
     <a href="https://terra-z.github.io/terraz/anfrage.html" class="btn-main">
         <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        info@terra-z.de
      </a>
    </div>
  </div>

  <div class="bottom-bar"></div>
</div>
</body>
</html>
